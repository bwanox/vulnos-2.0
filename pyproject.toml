[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "vulnos"
version = "2.0.0-dev"
description = "Autonomous Red-vs-Blue Security & Patching Kernel"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "VulnOS Team"},
]

dependencies = [
    # AST & Static Analysis
    "tree-sitter>=0.21.0",
    "semgrep>=1.50.0",

    # LLM Orchestration
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "openai>=1.12.0",

    # Tavily Intelligence
    "tavily-python>=0.3.0",

    # Sandbox
    "docker>=7.0.0",

    # Telemetry
    "websockets>=12.0",
    "rich>=13.0",

    # Utilities
    "pydantic>=2.5.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "gitpython>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]
hud = [
    "textual>=0.47.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
